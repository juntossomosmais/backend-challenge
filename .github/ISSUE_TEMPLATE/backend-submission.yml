name: "Backend Challenge Submission"
description: "Submit your backend challenge solution"
title: "[Backend] "
labels: ["submission", "backend", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Thanks for submitting your challenge! 🎉
        Please fill out the information below so we can review your work.

  - type: input
    id: name
    attributes:
      label: Full Name
      placeholder: "John Doe"
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email
      placeholder: "john.doe@example.com"
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: "Link to your public GitHub repository"
      placeholder: "https://github.com/username/my-challenge"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language Used
      options:
        - Python
        - C#
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      description: "Confirm you've completed these items"
      options:
        - label: "API is functional and passes `validate.sh`"
          required: true
        - label: "README with setup instructions is included"
          required: true
        - label: "`/ai-journey` folder is present with documentation"
          required: true
        - label: "Tests are included"
          required: false
        - label: "Docker/Docker Compose is configured"
          required: false

  - type: textarea
    id: approach
    attributes:
      label: Approach Summary
      description: "Briefly describe your approach, architecture decisions, and any trade-offs you made"
      placeholder: |
        - Used FastAPI for the REST API
        - Implemented repository pattern for data access
        - Chose to prioritize readability over micro-optimizations
        - Trade-off: Kept it simple instead of adding caching
    validations:
      required: true

  - type: textarea
    id: ai-summary
    attributes:
      label: AI Usage Summary
      description: "Quick summary of how you used AI tools (details should be in /ai-journey)"
      placeholder: |
        - Used ChatGPT for initial project structure
        - Claude helped debug the E.164 regex
        - Copilot for boilerplate code
    validations:
      required: true

  - type: textarea
    id: challenges
    attributes:
      label: Biggest Challenges
      description: "What was the hardest part? What would you do differently with more time?"
      placeholder: |
        Hardest: Understanding the bounding box logic for classification
        With more time: Would add integration tests and improve error messages
    validations:
      required: false

  - type: input
    id: linkedin
    attributes:
      label: LinkedIn
      description: "Your LinkedIn profile URL"
      placeholder: "https://linkedin.com/in/johndoe"
    validations:
      required: true

  - type: input
    id: github-profile
    attributes:
      label: GitHub Profile
      description: "Your GitHub profile URL (not the challenge repo)"
      placeholder: "https://github.com/johndoe"
    validations:
      required: true

  - type: input
    id: time-spent
    attributes:
      label: Time Spent (optional)
      description: "Approximately how long did you spend on this?"
      placeholder: "~12 hours over 4 days"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything Else?
      description: "Any additional context you'd like to share"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **What happens next?**
        1. Our team will review your submission
        2. We may reach out with questions or feedback
        3. Great submissions stay on our radar for future opportunities

        Thanks for your interest in Juntos Somos Mais! 💛
